# Copy this file to deploy/config/app.yaml before starting the example stack.
# Replace every REPLACE_* value. The database, Redis, and Meilisearch passwords
# must match the files under deploy/secrets/.
database:
  driver: postgres
  host: postgres
  port: "5432"
  username: web
  password: REPLACE_WITH_POSTGRES_APP_PASSWORD
  database: web
  ssl_mode: disable
redis:
  addr: redis:6379
  password: REPLACE_WITH_REDIS_PASSWORD
  db: 0
etcd:
  endpoints:
    - etcd:2379
email:
  from: no-reply@example.com
  username: ""
  password: ""
  host: smtp.example.com
  port: 587
turnstile:
  secret_key: ""
  verify_url: https://challenges.cloudflare.com/turnstile/v0/siteverify
internal_service:
  token: REPLACE_WITH_RANDOM_INTERNAL_TOKEN
jwt:
  private_key_path: /run/secrets/web_jwt_private
  public_key_path: /run/secrets/web_jwt_public
telemetry:
  file_log:
    enabled: false
    file_path: ""
  otel:
    enabled: false
    namespace: aqua
    otlp:
      endpoint: ""
      username: ""
      api_key: ""
meilisearch:
  host: http://meilisearch:7700
  api_key: REPLACE_WITH_MEILISEARCH_KEY
