syntax = "proto3";

package aqua.user.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "aqua/gen/go/aqua/user/v1;userv1";

message User {
  int32 uid = 1;
  string username = 2;
  string nickname = 3;
  string email = 4;
  string phone = 5;
  string avatar = 6;
  int32 gender = 7;
  int32 lock = 8;
  google.protobuf.Timestamp register_at = 9;
  google.protobuf.Timestamp last_login_at = 10;
}

message Role {
  int32 id = 1;
  string code = 2;
  string description = 3;
}

message Permission {
  int32 id = 1;
  string code = 2;
  string description = 3;
}

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListUsersResponse {
  repeated User users = 1;
}

message SearchUsersRequest {
  string keyword = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message SearchUsersResponse {
  repeated User users = 1;
}

message UpdateUserRequest {
  int32 uid = 1;
  google.protobuf.StringValue nickname = 2;
  google.protobuf.StringValue email = 3;
  google.protobuf.StringValue phone = 4;
  google.protobuf.StringValue avatar = 5;
  google.protobuf.Int32Value gender = 6;
  google.protobuf.Int32Value lock = 7;
}

message UpdateUserResponse {}

message ListUserRolesRequest {
  int32 uid = 1;
}

message ListUserRolesResponse {
  repeated Role roles = 1;
}

message AddUserRoleRequest {
  int32 uid = 1;
  int32 id = 2;
}

message AddUserRoleResponse {}

message DeleteUserRoleRequest {
  int32 uid = 1;
  int32 id = 2;
}

message DeleteUserRoleResponse {}

message ListUserPermissionsRequest {
  int32 uid = 1;
}

message ListUserPermissionsResponse {
  repeated Permission permissions = 1;
}

message ListRolesRequest {}

message ListRolesResponse {
  repeated Role roles = 1;
}

message CreateRoleRequest {
  string code = 1;
  string description = 2;
}

message CreateRoleResponse {}

message UpdateRoleRequest {
  int32 id = 1;
  string code = 2;
  string description = 3;
}

message UpdateRoleResponse {}

message DeleteRoleRequest {
  int32 id = 1;
}

message DeleteRoleResponse {}

message ListPermissionsRequest {}

message ListPermissionsResponse {
  repeated Permission permissions = 1;
}

message CreatePermissionRequest {
  string code = 1;
  string description = 2;
}

message CreatePermissionResponse {}

message UpdatePermissionRequest {
  int32 id = 1;
  string code = 2;
  string description = 3;
}

message UpdatePermissionResponse {}

message DeletePermissionRequest {
  int32 id = 1;
}

message DeletePermissionResponse {}

message ListRolePermissionsRequest {
  int32 id = 1;
}

message ListRolePermissionsResponse {
  repeated Permission permissions = 1;
}

message AddRolePermissionRequest {
  int32 role_id = 1;
  int32 permission_id = 2;
}

message AddRolePermissionResponse {}

message DeleteRolePermissionRequest {
  int32 role_id = 1;
  int32 permission_id = 2;
}

message DeleteRolePermissionResponse {}
